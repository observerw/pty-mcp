[package]
name = "pty-mcp"
version = "0.3.0"
edition = "2024"
description = "An MCP server for PTY management with SSH connections, remote sessions, file access, and mounts"
license = "MIT"
readme = "README.md"
repository = "https://github.com/observerw/pty-mcp"
homepage = "https://github.com/observerw/pty-mcp"
keywords = ["mcp", "pty", "ssh", "terminal", "remote"]
categories = [
    "command-line-utilities",
    "network-programming",
    "development-tools",
]

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.5.39", features = ["derive"] }
nix = { version = "0.31.2", features = ["process", "signal"] }
portable-pty = "0.9.0"
regex = "1.12.3"
rmcp = { version = "1.2.0", features = [
    "server",
    "macros",
    "transport-io",
    "client",
] }
schemars = { version = "1.2.1", features = ["chrono04"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strip-ansi-escapes = "0.2.1"
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.22.0", features = ["serde", "v4"] }
